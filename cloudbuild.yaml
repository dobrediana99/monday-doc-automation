options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  dynamic_substitutions: true

substitutions:
  _SERVICE_NAME: monday-doc-automation
  _REGION: europe-west1
  _PLATFORM: managed
  _ALLOW_UNAUTHENTICATED: "true"
  _CPU: "1"
  _MEMORY: 512Mi
  _TIMEOUT: 300s
  _MAX_INSTANCES: "10"
  _MIN_INSTANCES: "0"

steps:
  - id: Build image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/monday-doc-automation:$SHORT_SHA
      - .

  - id: Push image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/monday-doc-automation:$SHORT_SHA

  - id: Deploy Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        auth_flag="--no-allow-unauthenticated"
        if [[ "${_ALLOW_UNAUTHENTICATED}" == "true" ]]; then
          auth_flag="--allow-unauthenticated"
        fi

        gcloud run deploy "${_SERVICE_NAME}" \
          --project "$PROJECT_ID" \
          --image "gcr.io/$PROJECT_ID/monday-doc-automation:$SHORT_SHA" \
          --platform "${_PLATFORM}" \
          --region "${_REGION}" \
          "$${auth_flag}" \
          --cpu "${_CPU}" \
          --memory "${_MEMORY}" \
          --timeout "${_TIMEOUT}" \
          --max-instances "${_MAX_INSTANCES}" \
          --min-instances "${_MIN_INSTANCES}" \
          --quiet

images:
  - gcr.io/$PROJECT_ID/monday-doc-automation:$SHORT_SHA
